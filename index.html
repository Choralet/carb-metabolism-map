<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf9f3" />
    <meta name="description" content="Interactive metabolism atlas for 2310380: carbohydrates (midterm), lipids and N-containing compounds (final)." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Atlas" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23221E19%27/%3E%3Cpath d=%27M9 23V9m0 0 5 3.5M9 9 4 12.5M23 9v14m0 0-5-3.5m5 3.5 5-3.5%27 fill=%27none%27 stroke=%27%23FBF7EF%27 stroke-width=%272.2%27 stroke-linecap=%27round%27/%3E%3C/svg%3E" />
    <title>Metabolism Atlas</title>
    <script>
      // Theme before first paint: the saved choice, else the system setting (storage may be blocked, so guard it).
      (function () {
        var t = null;
        try { t = localStorage.getItem('atlas-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1916');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
